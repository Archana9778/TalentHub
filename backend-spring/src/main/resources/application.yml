server:
  port: 5000

spring:
  application:
    name: talenthub-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talenthub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:talenthub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:talenthub_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

# Azure Actuator & Health Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# JWT Security Configuration
talenthub:
  jwt:
    secret: talenthub-super-secret-azure-enterprise-key-2026-very-secure-hmac-sha256
    expiration-ms: 604800000 # 7 days
  upload:
    dir: uploads/resumes

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

