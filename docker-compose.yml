services:
  database:
    image: mysql:8.0
    container_name: talenthub-mysql
    restart: always
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Missing MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER:?Missing MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}"
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: talenthub-spring-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?Missing datasource URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?Missing datasource username}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?Missing datasource password}"
      TALENTHUB_JWT_SECRET: "${TALENTHUB_JWT_SECRET:?Missing JWT secret}"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talenthub-frontend-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend-spring

volumes:
  mysql_data:
