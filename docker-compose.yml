services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Missing MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER:?Missing MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}"
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?Missing datasource URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?Missing datasource username}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?Missing datasource password}"
      TALENTHUB_JWT_SECRET: "${TALENTHUB_JWT_SECRET:?Missing JWT secret}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_ALT_PORT:-5173}:80"
    depends_on:
      - backend

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: talenthub-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"   # Blob service
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log

volumes:
  mysql_data:
  azurite_data:
