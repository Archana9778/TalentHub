services:
  # --- Tier 3: Data Tier (MySQL 8.0 / Azure Database for MySQL Flexible Server Target) ---
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the root .env file}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the root .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Tier 2: Application Tier (Node.js + Express + TypeScript REST API) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_MODE=mysql
      - DB_HOST=database
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?Set DB_USER in the root .env file}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      - DB_NAME=${DB_NAME:?Set DB_NAME in the root .env file}
      - DB_SSL=${DB_SSL:-false}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:5173}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Tier 1: Presentation Tier (React 18 + TypeScript on NGINX) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_ALT_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
