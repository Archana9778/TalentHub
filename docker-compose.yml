services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-talenthub}"
      MYSQL_USER: "${MYSQL_USER:-talenthub_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root123}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root123}"
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root123} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talenthub-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: talenthub-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"   # Blob service
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log --skipApiVersionCheck
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      talenthub-network:
        aliases:
          - azurite

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_MODE: mysql
      DB_DRIVER: mysql2
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-${MYSQL_DATABASE:-talenthub}}"
      DB_USER: "${DB_USER:-${MYSQL_USER:-talenthub_user}}"
      DB_PASSWORD: "${DB_PASSWORD:-${MYSQL_PASSWORD:-root123}}"
      DB_SSL: "false"
      JWT_SECRET: "${JWT_SECRET:-${TALENTHUB_JWT_SECRET:-talenthub-super-secret-azure-enterprise-key-2026-very-secure-hmac-sha256}}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      PASSWORD_RESET_EXPIRES_MINUTES: "${PASSWORD_RESET_EXPIRES_MINUTES:-15}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173},http://localhost:${FRONTEND_HTTP_PORT:-80},http://localhost,http://127.0.0.1:${FRONTEND_PORT:-5173}}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-azurite}"
      AZURE_STORAGE_ACCOUNT_NAME: "${AZURE_STORAGE_ACCOUNT_NAME:-devstoreaccount1}"
      AZURE_STORAGE_CONTAINER_NAME: "${AZURE_STORAGE_CONTAINER_NAME:-talenthub-resumes}"
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
      RESUME_MAX_FILE_SIZE_MB: "${RESUME_MAX_FILE_SIZE_MB:-10}"
      MAX_RESUME_SIZE_MB: "${MAX_RESUME_SIZE_MB:-10}"
      AZURE_STORAGE_SAS_EXPIRY_MINUTES: "${AZURE_STORAGE_SAS_EXPIRY_MINUTES:-15}"
      RESUME_SAS_EXPIRY_MINUTES: "${RESUME_SAS_EXPIRY_MINUTES:-15}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-TalentHub Security <no-reply@talenthub.com>}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
    depends_on:
      database:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - talenthub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - talenthub-network

volumes:
  mysql_data:
  azurite_data:

networks:
  talenthub-network:
    driver: bridge
